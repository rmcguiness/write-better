name: Feature request
description: Suggest an idea for Write Better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check ROADMAP.md first. Your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
