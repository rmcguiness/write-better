version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Expo SDK and React Native upgrades are done deliberately with `npx expo install --fix`.
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # react/react-dom are pinned to the exact version the Expo SDK ships (react-native's
      # renderer requires an exact match), so even patch bumps break `npm ci`. Upgrade them
      # with `npx expo install --fix` when moving SDKs.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
